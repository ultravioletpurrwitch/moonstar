<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
<head>
    <meta charset="UTF-8">
   <title>hi sunshine 🌟</title>

  <style>

    body {

      font-family: "Courier New", monospace;

      color: #a03d7c;

      background: #f591f0;

      padding: 70px;

    }

    .card {

      background: #fbd3f9;

      padding: 30px;

      border-radius: 15px;

      max-width: 500px;

      margin: auto;

      text-align: center;

    }

    button {

      padding: 10px 20px;

      border: none;

      border-radius: 8px;

      cursor: pointer;

    }

  </style>

</head>

<body>

  <div class="card">

   <h1 style="color: snow;">hi hi moonstar 🌙🌟</h1>

    <p>complimentary treats due to cuteness: 
        *offers*🍦&🍓 </p>

    <button onclick="changeText()">Click me</button>

    <p id="message"></p>

  </div>

  <script>

const emojis = [

"🌸","🍦","🌷","🌙","⭐","🪻","🍓","✨",

"💖","🌼","🦄","🫐","🌿","🐬","🦋",

"🌛","🌕","🪐","🌈","💫","🍒","🍉"

];

function createEmoji() {

    const emoji = document.createElement("div");

    emoji.innerText =

        emojis[Math.floor(Math.random() * emojis.length)];

    const startX = Math.random() * window.innerWidth;

    let y = -50;

    const speed = 2 + Math.random() * 4;

    const waveSize = 30 + Math.random() * 50;

    const waveSpeed = 0.01 + Math.random() * 0.05;

    emoji.style.position = "fixed";

    emoji.style.top = "-50px";

    emoji.style.fontSize =

        (20 + Math.random() * 30) + "px";

    emoji.style.pointerEvents = "none";

    emoji.style.zIndex = "9999";

    document.body.appendChild(emoji);

    let time = 0;

    const fall = setInterval(() => {

        y += speed;

        time++;

        const x =

            startX +

            Math.sin(time * waveSpeed) * waveSize;

        emoji.style.left = x + "px";

        emoji.style.top = y + "px";

        if (y > window.innerHeight + 50) {

            clearInterval(fall);

            emoji.remove();

        }

    }, 16);

}

function changeText() {

    document.getElementById("message").innerText =

        "ok here's a rose (o_0)🌹"+
        "         ."+
        "         ."+
        "         ."+
        "initiating whimsical weather";

    setInterval(createEmoji, 40);

}

</script>

</body>

</html>
